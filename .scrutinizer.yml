checks:
  php:
    code_rating: true
    duplication: true

filter:
  excluded_paths:
    - "demo/*"
    - "tests/*"
    - "vendor/*"
    - "node_modules/*"

build:
  environment:
    php:
      version: 8.3
      ini:
        memory_limit: -1
        # PHPUnit needs a coverage driver: Xdebug 3 must run in coverage mode, or use PCOV (see GitHub CI).
        'xdebug.mode': coverage
    # No Node here: Scrutinizer workers use an older glibc (Node 18+ needs GLIBC_2.28), so the
    # frontend (Vitest) tests run on GitHub Actions instead (.github/workflows/ci.yml).

  cache:
    directories:
      - vendor/

  tests:
    before:
      - composer validate --strict
      - composer install --no-interaction --prefer-dist --optimize-autoloader
    override:
      # Same as local / GitHub `composer test-coverage`; clover must exist for Scrutinizer.
      # Vitest/pnpm are not run here (see the environment comment above). Use `.github/workflows/ci.yml`.
      - command: composer test-coverage
        environment:
          XDEBUG_MODE: coverage
        coverage:
          file: coverage.xml
          format: clover
