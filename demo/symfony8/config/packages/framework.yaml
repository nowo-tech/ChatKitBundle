framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true
    fragments: true
    default_locale: en
    enabled_locales: ['en', 'es']

    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native

    php_errors:
        log: true

    # REQ-RUNTIME-001: outbound HTTP never waits unbounded (innermost layer of the hierarchy:
    # HttpClient 5s < PHP max_execution_time 30s < Caddy write 60s; see docker/frankenphp/Caddyfile).
    http_client:
        default_options:
            timeout: 5
