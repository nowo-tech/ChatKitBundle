security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: plaintext
    providers:
        users_in_memory:
            memory:
                users:
                    alice: { password: 'password', roles: ['ROLE_USER'] }
                    bob: { password: 'password', roles: ['ROLE_USER'] }
                    support: { password: 'password', roles: ['ROLE_USER', 'ROLE_SUPPORT'] }
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: users_in_memory
            form_login:
                login_path: demo_login
                check_path: demo_login
                enable_csrf: true
                default_target_path: /en
            logout:
                path: demo_logout
                target: /en
    access_control:
        - { path: ^/, roles: PUBLIC_ACCESS }
