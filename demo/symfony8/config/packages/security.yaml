security:
    password_hashers:
        # Demo only: plain-text passwords for the seeded accounts (app:demo:seed).
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: plaintext
    providers:
        demo_users:
            entity:
                class: App\Entity\User
                property: username
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: demo_users
            form_login:
                login_path: demo_login
                check_path: demo_login
                enable_csrf: true
                default_target_path: /en
            logout:
                path: demo_logout
                target: /en
    access_control:
        - { path: ^/, roles: PUBLIC_ACCESS }
