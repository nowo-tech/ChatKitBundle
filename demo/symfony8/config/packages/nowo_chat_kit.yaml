# NowoChatKitBundle demo configuration (REQ-CFG-001: default_profile + profiles).
nowo_chat_kit:
    default_profile: default
    profiles:
        default:
            enabled: true
            user_class: App\Entity\User
            # The full-page chat (/chat/) renders in nowo_ui_kit.layouts.admin (web_ui.layout_template: null);
            # REQ-UI-003 — the 1.x page_layout option is deprecated.
            # web_ui:
            #     layout_template: null
