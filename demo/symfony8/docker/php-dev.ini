; Recheck compiled PHP files every request so Twig-compiled templates in var/cache are always fresh
opcache.revalidate_freq=0

; REQ-RUNTIME-001: PHP deadline sits between the HttpClient timeout (5s, config/packages/framework.yaml)
; and the Caddy write timeout (60s, docker/frankenphp/Caddyfile*): 5s < 30s < 60s.
max_execution_time=30
max_input_time=30
