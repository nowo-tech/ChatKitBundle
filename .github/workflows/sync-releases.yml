name: Sync Missing Releases

# Idempotent backfill of GitHub Releases from v* tags (logic in nowo-tech/ci-actions).
# release.yml handles the tag push itself; this workflow does not run on tag pushes.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report what would change'
        type: boolean
        default: false
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

concurrency:
  group: sync-releases-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync-releases:
    uses: nowo-tech/ci-actions/.github/workflows/sync-releases.yml@main
    with:
      dry-run: ${{ inputs.dry_run || false }}
