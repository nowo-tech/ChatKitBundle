# CodeRabbit integration (logic in nowo-tech/ci-actions).
# GitHub App (recommended): install https://github.com/apps/coderabbitai on the repository.
# CLI job (optional): set repository secret CODERABBIT_API_KEY.

name: CodeRabbit

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]

  push:
    branches: [main, master]

  workflow_run:
    workflows: [CI]
    types: [completed]

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: coderabbit-${{ github.event.pull_request.number || github.event.workflow_run.id || github.sha }}
  cancel-in-progress: true

jobs:
  coderabbit:
    uses: nowo-tech/ci-actions/.github/workflows/coderabbit.yml@v1
    secrets:
      CODERABBIT_API_KEY: ${{ secrets.CODERABBIT_API_KEY }}
