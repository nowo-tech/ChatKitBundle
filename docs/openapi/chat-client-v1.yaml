# ChatKitBundle client API v1 (2.4; 2.5 writes; 2.6 typed cards; 2.7 attachments). Kept in step with the routes by ChatClientApiOpenApiTest. See docs/API.md.
openapi: 3.1.0
info:
  title: ChatKitBundle client API
  version: 1.5.0
  description: >-
    Stateless chat API for native clients (Beacon Desktop): reads, the reader's own read marks, (2.4.1) logout and
    (2.5) writes: send, thread reply, reactions, edit and delete of one's own message (scope chat:write, off until
    client_api.writes; me.features tells which) and (2.6, spec 259) typed cards: a `card` object on reference tokens,
    a `cards` field on send and thread reply, and the host's composer actions on a conversation; (2.7, spec 259) attachments: uploads scanned before they can be sent, `attachments` on messages with short-lived signed URLs, and an `attachments` field on send. Bearer tokens of the host (ChatKit issues none); off until the host configures client_api.principal_resolver. Paths are relative to
    <client_api.prefix>/chat/v1 (default /api/chat/v1). Every request names its context in the context header
    (client_api.context_header; Beacon X-Beacon-Context) when the host has a context policy. Responses are never
    cached. Unknown, foreign or out-of-context uuids answer 404, never 403.
servers:
  - url: /api/chat/v1
security:
  - bearer: []
paths:
  /me:
    get:
      operationId: me
      summary: The caller, the token's scopes, the request's context, the contexts the caller may use, and what the server offers
      parameters:
        - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /conversations:
    get:
      operationId: conversations
      summary: The caller's conversations in the context, newest activity first, a page at a time
      description: >-
        Follow nextCursor until it is null; a page may hold fewer rows than limit, or none. unreadTotal is answered on
        the first page only (muted conversations excluded, counted over the 200 most recent conversations).
      parameters:
        - $ref: '#/components/parameters/Context'
        - name: archived
          in: query
          required: false
          description: 1 lists the conversations the caller closed.
          schema: { type: boolean, default: false }
        - name: cursor
          in: query
          required: false
          description: The nextCursor of the previous page.
          schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [conversations, nextCursor, unreadTotal, unreadTotalCapped]
                properties:
                  unreadTotalCapped:
                    type: [boolean, 'null']
                    description: First page only; true when more conversations exist than were counted (show "200+").
                  conversations:
                    type: array
                    items: { $ref: '#/components/schemas/Conversation' }
                  nextCursor: { type: [string, 'null'] }
                  unreadTotal: { type: [integer, 'null'] }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /conversations/{uuid}:
    get:
      operationId: conversation
      summary: One conversation, with its member count and the caller's permissions
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/ConversationUuid'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [conversation]
                properties:
                  conversation:
                    allOf:
                      - $ref: '#/components/schemas/Conversation'
                      - type: object
                        required: [membersCount, permissions]
                        properties:
                          membersCount: { type: integer }
                          permissions:
                            type: object
                            properties:
                              send: { type: boolean, description: 'Whether the caller may post here (the write routes follow the same rule).' }
                          composerActions:
                            type: array
                            description: >-
                              2.6 (spec 259): the host's composer actions for the caller (none without write rights or
                              while writes are off). Their dialogs are web pages: a native client builds its own flow.
                            items:
                              type: object
                              required: [key, label, icon, slash]
                              properties:
                                key: { type: string, pattern: '^[a-z][a-z0-9_-]{0,31}$' }
                                label: { type: string }
                                icon: { type: string }
                                slash: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /conversations/{uuid}/messages:
    get:
      operationId: messages
      summary: A page of messages, oldest first (the newest page, an older page, or a catch-up page)
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/ConversationUuid'
        - name: before
          in: query
          required: false
          description: Older than this message id. Not with after.
          schema: { type: integer, minimum: 1 }
        - name: after
          in: query
          required: false
          description: Newer than this message id (catch-up). Not with before.
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [messages, hasMore, readUpTo]
                properties:
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
                  hasMore: { type: boolean }
                  readUpTo: { type: [integer, 'null'] }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: send
      summary: Sends a message (2.5, scope chat:write); the web UI's rules and side effects
      description: >-
        Same posting rights as the web UI (403 read_only: read-only channel, blocked direct message, closed ticket),
        same pipeline (mentions resolved, #references validated, unread counters, realtime, Web Push, digest, search
        index, events). The Idempotency-Key is required and deduplicated per token and conversation for 24 hours: the
        same key and text answer the first message (200, replayed true); the same key with another text is 422
        idempotency_mismatch. 404 while client_api.writes is off.
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/ConversationUuid'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WriteBodySend' }
      responses:
        '201':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Written' }
        '200':
          description: A replay of the same Idempotency-Key (nothing written)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Written' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/WriteError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /conversations/{uuid}/messages/{messageUuid}:
    get:
      operationId: message
      summary: One message (fetched after a realtime hint)
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/ConversationUuid'
        - name: messageUuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      operationId: edit
      summary: Edits one of the caller's own messages within the edit window (2.5, scope chat:write)
      description: >-
        403 read_only without posting rights; 403 edit_forbidden for someone else's message, a buzz, a tombstone or
        after limits.editWindowSeconds. The same text again changes nothing. Idempotency-Key as send.
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/ConversationUuid'
        - $ref: '#/components/parameters/MessageUuid'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WriteBody' }
      responses:
        '200':
          description: Edited (or unchanged, or a replay)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Written' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/WriteError' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: delete
      summary: Deletes one of the caller's own messages within the edit window (2.5, scope chat:write)
      description: >-
        403 delete_forbidden for someone else's message (nobody deletes it) or after the window. Deleting one's own
        message that is already deleted answers its tombstone again. Idempotency-Key as send.
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/ConversationUuid'
        - $ref: '#/components/parameters/MessageUuid'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The tombstone (body null, deleted true)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Written' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/WriteError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /conversations/{uuid}/messages/{messageUuid}/thread:
    get:
      operationId: thread
      summary: A thread's root and a page of its replies (30, oldest first); a reply's uuid opens its root's thread
      description: 404 while threads are off (message_menu.threads.enabled). Replying is POST on the same path (2.5).
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/ConversationUuid'
        - name: messageUuid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: before
          in: query
          required: false
          description: Replies older than this id. Not with after.
          schema: { type: integer, minimum: 1 }
        - name: after
          in: query
          required: false
          description: Replies newer than this id (catch-up). Not with before.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [root, replies, hasMore, replyCount, readUpTo, following]
                properties:
                  root: { $ref: '#/components/schemas/Message' }
                  replies:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
                  hasMore: { type: boolean }
                  replyCount: { type: integer }
                  readUpTo: { type: [integer, 'null'] }
                  following: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: threadReply
      summary: Replies in the thread of a message (2.5, scope chat:write); a reply's uuid replies in its root's thread
      description: >-
        404 while threads are off; 403 read_only without posting rights; 422 not_threadable for a message that takes no
        thread (a line, a buzz, a bot message, a tombstone). Idempotency-Key as send.
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/ConversationUuid'
        - $ref: '#/components/parameters/MessageUuid'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WriteBodyCards' }
      responses:
        '201':
          description: Replied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Replied' }
        '200':
          description: A replay of the same Idempotency-Key (nothing written)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Replied' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/WriteError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /conversations/{uuid}/messages/{messageUuid}/reactions/{emoji}:
    put:
      operationId: addReaction
      summary: Sets the caller's reaction (2.5, scope chat:write); idempotent
      description: >-
        The emoji is URL-encoded in the path and must be one of me.reactions.accepted (else 422 invalid_reaction).
        Setting a reaction one already has changes and publishes nothing. 403 read_only without posting rights; 422
        not_reactable for a line, a buzz or a tombstone. Idempotency-Key required (as send).
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/ConversationUuid'
        - $ref: '#/components/parameters/MessageUuid'
        - $ref: '#/components/parameters/Emoji'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The message's reactions after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reacted' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/WriteError' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: removeReaction
      summary: Removes the caller's reaction (2.5, scope chat:write); idempotent
      description: Removing a reaction one does not have changes and publishes nothing. Otherwise as PUT.
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/ConversationUuid'
        - $ref: '#/components/parameters/MessageUuid'
        - $ref: '#/components/parameters/Emoji'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The message's reactions after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reacted' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/WriteError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /conversations/{uuid}/read:
    post:
      operationId: read
      summary: Moves the caller's read cursor (scope chat:read, Q-BD-8); capped at the newest message, never moved back
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/ConversationUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messageId]
              properties:
                messageId: { type: integer, minimum: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, readUpTo]
                properties:
                  ok: { type: boolean, const: true }
                  readUpTo: { type: [integer, 'null'] }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /conversations/{uuid}/attachments:
    post:
      operationId: uploadAttachment
      summary: Uploads one file as a draft of the caller (2.7, scope chat:write)
      description: >-
        The file is stored and scanned before it can be sent: `state` is `uploaded` (then `scanning`), and `clean`,
        `blocked` or `failed` once the scan ended (poll GET attachments/{uuid} or listen to the `attachment` realtime
        event). Only the uploader ever sees a draft. The type is decided by the server (magic bytes and extension must
        agree). Idempotency-Key required (per token and conversation). 404 while me.features.attachments is false.
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/ConversationUuid'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Stored as a draft (not yet scanned)
          content:
            application/json:
              schema:
                type: object
                required: [attachment]
                properties:
                  attachment: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/WriteError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
  /conversations/{uuid}/attachments/drafts:
    get:
      operationId: attachmentDrafts
      summary: The caller's drafts in the conversation (2.7)
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/ConversationUuid'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [attachments]
                properties:
                  attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /attachments/{uuid}:
    get:
      operationId: attachment
      summary: One file as the caller may see it, with fresh signed URLs when clean (2.7)
      parameters:
        - $ref: '#/components/parameters/Context'
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [attachment]
                properties:
                  attachment: { $ref: '#/components/schemas/Attachment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: removeAttachment
      summary: Removes a draft, or a file of a message the caller may delete (2.7, scope chat:write)
      parameters:
        - $ref: '#/components/parameters/Context'
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Removed (idempotent) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /files/{uuid}/{variant}:
    get:
      operationId: file
      summary: Downloads a file through its signed URL (2.7)
      description: >-
        The URL (from `urls.original`) is signed for this person, token and context and expires after 5 minutes; the
        request carries the Bearer token too, and access is checked again. 302 to a bucket URL valid 60 seconds, or the
        bytes (206 for a single Range). Always nosniff and a sandbox CSP; a download, except audio and video. Every
        refusal (bad or expired signature, unknown, foreign, removed) is an empty 404.
      parameters:
        - $ref: '#/components/parameters/Context'
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: variant
          in: path
          required: true
          schema: { type: string, enum: [original] }
        - { name: e, in: query, required: true, schema: { type: string } }
        - { name: s, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: The bytes }
        '206': { description: One byte range }
        '302': { description: A bucket URL pre-signed for 60 seconds }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Not found (empty body) }
        '416': { description: Range not satisfiable }
        '429': { $ref: '#/components/responses/RateLimited' }
    head:
      operationId: fileHead
      summary: The headers of a download (2.7)
      parameters:
        - $ref: '#/components/parameters/Context'
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: variant
          in: path
          required: true
          schema: { type: string, enum: [original] }
      responses:
        '200': { description: The headers }
        '404': { description: Not found }
  /logout:
    post:
      operationId: logout
      summary: Signs the client out (2.4.1); the host revokes the presented token, and only it
      description: >-
        Revokes the Bearer token of the request through the host's token revoker (client_api.token_revoker): never the
        person's other tokens or devices. Always 204 with no body when a usable Bearer token is sent, also for a token
        that was already revoked, has expired or is unknown (never an oracle): a client may retry it. A token the
        resolver refuses is not revoked. No scope, context or account check (a token may always be given up); the
        context header is ignored. The per-IP budget and a per-token logout budget of its own (separate from the
        token's budget on the other routes) apply: 429 + Retry-After, retry later, the token is not revoked yet; only
        a still-valid token can get the per-token 429. Without a revoker the answer is still 204 but the token stays
        valid until it expires (me.features.serverLogout is false).
      responses:
        '204':
          description: Signed out (or nothing to sign out). No body.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /realtime:
    get:
      operationId: realtime
      summary: The hub URL and a short-lived subscriber token for the caller's own private topic (enabled false → poll)
      parameters:
        - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [enabled, hubUrl, token, topic, expiresAt, events]
                properties:
                  enabled: { type: boolean }
                  hubUrl: { type: [string, 'null'] }
                  token: { type: [string, 'null'] }
                  topic: { type: string }
                  expiresAt: { type: string, format: date-time }
                  events: { type: string, enum: [full, ids] }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: A token of the host's client token system holding the chat:read scope (writes, 2.5, chat:write too).
  parameters:
    Context:
      name: X-Chat-Context
      in: header
      required: false
      description: >-
        The tenant of the request (the header name is client_api.context_header; Beacon X-Beacon-Context). Required when
        the host has a context policy and the token is not bound to a context. Never changes the person's web context.
      schema: { type: string, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$' }
    ConversationUuid:
      name: uuid
      in: path
      required: true
      schema: { type: string, format: uuid }
    MessageUuid:
      name: messageUuid
      in: path
      required: true
      schema: { type: string, format: uuid }
    Emoji:
      name: emoji
      in: path
      required: true
      description: The emoji, URL-encoded UTF-8 (one of me.reactions.accepted; at most 64 bytes decoded). Anything else is 422 invalid_reaction.
      schema: { type: string, maxLength: 64 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        2.5: a client-generated id of this write (a UUID fits), deduplicated per token and conversation for 24 hours.
        Send the same key again only to retry the same write (after a timeout, a lost answer, a 5xx, a 409 or a 429);
        a new write needs a new key. Missing: 400 idempotency_key_required; malformed: 400 idempotency_key_invalid.
      schema: { type: string, minLength: 1, maxLength: 80, pattern: '^[A-Za-z0-9_.:-]{1,80}$' }
  responses:
    Error:
      description: >-
        A refusal with a stable code: invalid_context, context_required, invalid_cursor, invalid_limit, invalid_json
        (400), idempotency_key_required, idempotency_key_invalid (400, writes); insufficient_scope,
        context_forbidden (403; also a token bound to a context with no context policy), 2.9 module_forbidden (403, valid
        token but the chat is closed to the person: module=chat, no WWW-Authenticate; the client hides the chat and does
        not sign out), read_only, edit_forbidden,
        delete_forbidden (403, writes); not_found (404, audited; also every write route while client_api.writes is
        off); invalid_message_id (422).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    WriteError:
      description: >-
        2.5 write refusals (422): unsupported_field (a body field other than text, e.g. 2.6 cards on a 2.5 server),
        invalid_text, empty_text, text_too_long, invalid_link, invalid_reaction, not_threadable, not_reactable,
        idempotency_mismatch (the key was used for another write); invalid_message_id (read).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: >-
        invalid_token (missing, unknown, expired or revoked token; since 2.9 not an account that cannot use the chat: that is 403 module_forbidden). POST /logout
        answers 401 only when there is no usable Bearer token (header absent, blank, or a token over 4096 bytes).
      headers:
        WWW-Authenticate: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: >-
        rate_limited (per IP, per token, 2.5 the token's write budget, or the person's own budgets shared with the web
        UI). A write refused with 429 wrote nothing: retry after Retry-After with the same Idempotency-Key.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: A lock conflict (code CONFLICT_001, Retry-After); retry.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean, const: false }
        error: { type: string }
        code: { type: string }
        message: { type: string, description: '2.9: module_forbidden only.' }
        module: { type: string, description: '2.9: module_forbidden only: chat.' }
    Me:
      type: object
      required: [apiVersion, user, scopes, context, contexts, features, limits, reactions]
      properties:
        apiVersion: { type: integer, const: 1 }
        user: { $ref: '#/components/schemas/Person' }
        scopes: { type: array, items: { type: string } }
        context: { type: [string, 'null'] }
        contexts:
          type: array
          items:
            type: object
            required: [key, label]
            properties:
              key: { type: string }
              label: { type: string }
        features:
          type: object
          properties:
            realtime: { type: boolean }
            realtimeEvents: { type: string, enum: [full, ids] }
            send: { type: boolean, description: '2.5: POST conversations/{uuid}/messages is offered (needs chat:write).' }
            threadReply: { type: boolean, description: '2.5: POST …/thread is offered (writes and threads on).' }
            reactions: { type: boolean, description: '2.5: PUT/DELETE …/reactions/{emoji} is offered.' }
            editOwn: { type: boolean, description: '2.5: PATCH of one''s own message is offered.' }
            deleteOwn: { type: boolean, description: '2.5: DELETE of one''s own message is offered.' }
            cards: { type: boolean, description: '2.6 (spec 259): true when the host has card providers — reference tokens may carry a `card` object and send / thread reply take `cards`; false in 2.5 (text only).' }
            search: { type: boolean }
            attachments: { type: boolean, description: '2.7 (spec 259): uploads, files in messages and signed downloads are offered.' }
            serverLogout:
              type: boolean
              description: >-
                2.4.1: true when POST /logout revokes the token on the server; false when the host configured no token
                revoker (logout then only tells the client to forget the token, which stays valid until it expires).
        limits:
          type: object
          properties:
            conversationsPageMax: { type: integer }
            messagesPageMax: { type: integer }
            textMaxLength: { type: integer, description: '2.5: longest text of a write, in characters.' }
            editWindowSeconds: { type: integer, description: '2.5: one may edit or delete one''s own message this long after sending it.' }
            idempotencyKeyMaxLength: { type: integer }
            attachments:
              type: object
              description: 2.7 — present while me.features.attachments is true.
              properties:
                maxBytes: { type: integer, description: The largest file accepted now. }
                maxPerMessage: { type: integer }
                kinds: { type: array, items: { type: string } }
                extensions: { type: array, items: { type: string } }
        reactions:
          type: object
          description: 2.5 — the quick row and every emoji the server accepts as a reaction.
          properties:
            quick: { type: array, items: { type: string } }
            accepted: { type: array, items: { type: string } }
    WriteBody:
      type: object
      description: >-
        2.5: the text only (Markdown as in the dock; @[Name](uuid) mentions and #[Title](type:id) references are resolved
        by the server as in the web UI). Every other field is refused (422 unsupported_field), never dropped. 2.6 (spec
        259) adds an optional typed card list (e.g. `cards: [{type, id}]`) behind me.features.cards; a 2.5 server
        refuses it, so a client sends it only when me.features.cards is true. `text` stays the field of the text.
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, maxLength: 4000 }
    WriteBodyCards:
      type: object
      description: >-
        2.6 (spec 259): a send or a thread reply. `text` as in WriteBody; `cards` only when me.features.cards is true
        (else 422 unsupported_field). Each card is appended after the text as its own paragraph; the host is asked
        whether the person may share it here, and one refused card refuses the whole write (422 card_not_allowed).
        422 invalid_cards for a malformed list.
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, maxLength: 4000, description: May be empty when cards are given. }
        cards:
          type: array
          maxItems: 10
          items:
            type: object
            required: [type, id]
            additionalProperties: false
            properties:
              type: { type: string, pattern: '^[a-z][a-z0-9_-]{0,31}$' }
              id: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
    WriteBodySend:
      type: object
      description: >-
        2.7 (spec 259): a send. `text` and `cards` as in WriteBodyCards; `attachments` (only when me.features.attachments
        is true, else 422 unsupported_field) lists clean drafts of the caller in this conversation, in order. `text` may
        be empty when files are given. One file still scanning refuses the whole send (409 attachment_not_ready); a
        blocked, failed, removed, foreign or already sent one too (422 attachment_invalid); more than maxPerMessage is
        422 too_many_attachments.
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, maxLength: 4000 }
        cards: { $ref: '#/components/schemas/WriteBodyCards/properties/cards' }
        attachments:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
    Attachment:
      type: object
      description: >-
        2.7 (spec 259): a file. In a message only clean files appear. `name` is user content (render it as text, never
        in a URL path). `urls` and `expiresAt` come with clean files only; ask GET attachments/{uuid} again when expired.
      required: [uuid, name, extension, mediaType, kind, size, state]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        extension: { type: string }
        mediaType: { type: string }
        kind: { type: string, enum: [image, pdf, text, markdown, code, office, audio, video, archive, other] }
        size: { type: integer }
        state: { type: string, enum: [uploaded, scanning, clean, blocked, failed] }
        urls:
          type: object
          properties:
            original: { type: string }
        expiresAt: { type: string, format: date-time }
    CardView:
      type: object
      description: 2.6 (spec 259) — what a typed card adds to its reference token. Plain text; same-origin paths.
      required: [state, facts, actions]
      properties:
        state: { type: string, enum: [open, locked] }
        facts:
          type: array
          maxItems: 4
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: string }
        actions:
          type: array
          maxItems: 3
          items:
            type: object
            required: [key, label, kind, url, dialog]
            properties:
              key: { type: string }
              label: { type: string }
              kind: { type: string, enum: [open, request_access, host] }
              url: { type: string, description: A same-origin path of the host (a web page). }
              dialog: { type: boolean }
    Written:
      type: object
      required: [message, replayed]
      properties:
        message: { $ref: '#/components/schemas/Message' }
        replayed: { type: boolean, description: True when an earlier request with the same Idempotency-Key wrote it. }
    Replied:
      type: object
      required: [message, root, replayed]
      properties:
        message: { $ref: '#/components/schemas/Message' }
        root: { $ref: '#/components/schemas/Message' }
        replayed: { type: boolean }
    Reacted:
      type: object
      required: [reactions, replayed]
      properties:
        reactions:
          type: array
          items:
            type: object
            required: [emoji, count, mine]
            properties:
              emoji: { type: string }
              count: { type: integer }
              mine: { type: boolean }
        replayed: { type: boolean }
    Person:
      type: object
      required: [uuid, name, initials, avatarUrl]
      properties:
        uuid: { type: string }
        name: { type: string }
        initials: { type: string }
        avatarUrl: { type: [string, 'null'] }
    Conversation:
      type: object
      required: [uuid, kind, title, subtitle, initials, unread, archived, mutedUntil, lastMessageAt, canSend]
      properties:
        uuid: { type: string, format: uuid }
        kind: { type: string, enum: [direct, channel, support] }
        title: { type: string }
        subtitle: { type: string }
        initials: { type: string }
        avatarUrl: { type: [string, 'null'] }
        peerUuid: { type: [string, 'null'] }
        peerStatus: { type: string }
        peerStatusText: { type: [string, 'null'] }
        peerStatusEmoji: { type: [string, 'null'] }
        channelKey: { type: [string, 'null'] }
        ticket:
          type: [object, 'null']
          properties:
            number: { type: [string, 'null'] }
            topicLabel: { type: [string, 'null'] }
            status: { type: string }
            statusLabel: { type: string }
            readOnly: { type: boolean }
        canSend: { type: boolean }
        unread: { type: integer }
        archived: { type: boolean }
        mutedUntil: { type: [string, 'null'], format: date-time }
        lastMessageAt: { type: string, format: date-time }
        lastMessageId: { type: [integer, 'null'] }
        lastMessage:
          type: [object, 'null']
          description: The preview is plain text for this reader (references it may not open read "Content not visible").
          properties:
            preview: { type: string }
            buzz: { type: boolean }
            pin: { type: boolean }
            deleted: { type: boolean }
            moderated: { type: boolean }
            mine: { type: boolean }
            authorName: { type: [string, 'null'] }
    Message:
      type: object
      required: [id, uuid, kind, author, mine, createdAt, edited, deleted, moderated, pinned, mentionsMe, reactions, body, previews]
      properties:
        id: { type: integer }
        uuid: { type: string, format: uuid }
        kind: { type: string }
        author:
          type: object
          properties:
            uuid: { type: [string, 'null'] }
            name: { type: string }
            initials: { type: string }
            avatarUrl: { type: [string, 'null'] }
            bot: { type: boolean }
            badges: { type: array, items: { type: object } }
        mine: { type: boolean }
        createdAt: { type: string, format: date-time }
        edited: { type: boolean }
        deleted: { type: boolean }
        moderated: { type: boolean }
        pinned: { type: boolean }
        pinnedMessage: { type: [string, 'null'] }
        mentionsMe: { type: boolean }
        mentionAll: { type: string, enum: [channel, here] }
        forwarded:
          type: object
          properties:
            from: { type: [string, 'null'] }
            label: { type: [string, 'null'] }
        threadRootUuid: { type: string }
        thread:
          type: object
          properties:
            count: { type: integer }
            lastReplyAt: { type: [string, 'null'] }
        reactions:
          type: array
          items:
            type: object
            required: [emoji, count, mine]
            properties:
              emoji: { type: string }
              count: { type: integer }
              mine: { type: boolean }
        body:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Body'
        attachments:
          type: array
          description: 2.7 — the message's clean files with URLs signed for this token (present while attachments are on).
          items: { $ref: '#/components/schemas/Attachment' }
        previews:
          type: array
          description: Link previews of this reader (the host's provider decides what the reader may see).
          items:
            type: object
            required: [url, title, subtitle, badge]
            properties:
              url: { type: string }
              title: { type: string }
              subtitle: { type: string }
              badge: { type: string }
    Body:
      type: object
      description: Structured tokens, never HTML (Q-BD-16). Render every string as text.
      required: [format, blocks]
      properties:
        format: { type: string, const: tokens/1 }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/Block' }
    Block:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [paragraph, quote, list, code] }
        tokens: { type: array, items: { $ref: '#/components/schemas/Token' } }
        ordered: { type: boolean }
        items:
          type: array
          items:
            type: array
            items: { $ref: '#/components/schemas/Token' }
        text: { type: string }
    Token:
      type: object
      required: [type]
      description: >-
        text (text, marks: bold|italic|strike), break, code (text), mention (userUuid, name), link (url: http(s) or
        mailto, text, card, provider), reference (visible true: refType, id, typeLabel, icon, title, url or null,
        subtitle, badge, tone; 2.6: a typed card also has `card` (CardView); visible false: text only — the neutral
        "not visible" placeholder, R2). `card` is a boolean on link tokens (a link card) and a CardView on references.
      properties:
        type: { type: string, enum: [text, break, code, mention, link, reference] }
        text: { type: string }
        marks: { type: array, items: { type: string, enum: [bold, italic, strike] } }
        userUuid: { type: string }
        name: { type: string }
        url: { type: [string, 'null'] }
        card:
          oneOf:
            - { type: boolean }
            - { $ref: '#/components/schemas/CardView' }
        provider:
          type: object
          properties:
            key: { type: string }
            label: { type: string }
        visible: { type: boolean }
        refType: { type: string }
        id: { type: string }
        typeLabel: { type: string }
        icon: { type: string }
        title: { type: string }
        subtitle: { type: string }
        badge: { type: string }
        tone: { type: string, enum: [neutral, info, success, warning, danger] }
